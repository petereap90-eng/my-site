<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <nav>
      <a href="index.html">home</a>
      <a class="here" href="movies.html">movies</a>
    </nav>

    <h1>Movies</h1>
    <p class="lede" id="count"></p>

    <div id="list"></div>
  </div>

  <script>
    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    // Free TMDB API key (v3). Paste it between the quotes.
    const TMDB_KEY = "c37c85cdf224f046aa2466c17912355e";

    function posterFor(m) {
      const cacheKey = "poster2:" + m.title + ":" + m.year;
      try {
        const hit = localStorage.getItem(cacheKey);
        if (hit) return Promise.resolve(hit);
      } catch (e) {}
      const url = "https://api.themoviedb.org/3/search/movie?api_key=" + TMDB_KEY +
        "&query=" + encodeURIComponent(m.title) + "&year=" + m.year;
      return fetch(url)
        .then(r => r.json())
        .then(d => {
          const path = d.results && d.results[0] && d.results[0].poster_path;
          if (!path) return null;
          const full = "https://image.tmdb.org/t/p/w342" + path;
          try { localStorage.setItem(cacheKey, full); } catch (e) {}
          return full;
        })
        .catch(() => null);
    }

    fetch("movies.json")
      .then(r => r.json())
      .then(movies => {
        movies.sort((a, b) => (b.watched || "").localeCompare(a.watched || ""));
        document.getElementById("count").textContent =
          movies.length + (movies.length === 1 ? " film logged." : " films logged.");

        const list = document.getElementById("list");
        if (!movies.length) {
          list.appendChild(el("p", "empty", "Nothing here yet."));
          return;
        }

        movies.forEach(m => {
          const row = el("div", "film");
          if (TMDB_KEY) {
            const img = el("img", "poster");
            img.alt = m.title + " poster";
            img.loading = "lazy";
            row.appendChild(img);
            posterFor(m).then(src => {
              if (src) img.src = src; else img.remove();
            });
          }
          const title = el("div", "title", m.title + " ");
          title.appendChild(el("span", "year", "(" + m.year + ")"));
          row.appendChild(title);
          list.appendChild(row);
        });
      })
      .catch(() => {
        document.getElementById("list").appendChild(
          el("p", "empty", "Couldn't load the list.")
        );
      });
  </script>
</body>
</html>
