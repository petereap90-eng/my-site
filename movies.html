<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <nav>
      <a href="index.html">home</a>
      <a class="here" href="movies.html">movies</a>
    </nav>

    <h1>Movies</h1>
    <p class="lede" id="count"></p>

    <div id="list"></div>
  </div>

  <script>
    function fmt(d) {
      const [y, m, day] = d.split("-").map(Number);
      return new Date(y, m - 1, day).toLocaleDateString("en-US", {
        year: "numeric", month: "short", day: "numeric"
      });
    }

    function el(tag, cls, text) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      if (text !== undefined) e.textContent = text;
      return e;
    }

    fetch("movies.json")
      .then(r => r.json())
      .then(movies => {
        movies.sort((a, b) => b.watched.localeCompare(a.watched));
        document.getElementById("count").textContent =
          movies.length + (movies.length === 1 ? " film logged." : " films logged.");

        const list = document.getElementById("list");
        if (!movies.length) {
          list.appendChild(el("p", "empty", "Nothing here yet."));
          return;
        }

        movies.forEach(m => {
          const row = el("div", "film");
          const title = el("div", "title", m.title + " ");
          title.appendChild(el("span", "year", "(" + m.year + ")"));
          row.appendChild(title);
          row.appendChild(el("div", "meta", "watched " + fmt(m.watched)));
          list.appendChild(row);
        });
      })
      .catch(() => {
        document.getElementById("list").appendChild(
          el("p", "empty", "Couldn't load the list.")
        );
      });
  </script>
</body>
</html>
