<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <nav>
      <a href="index.html">home</a>
      <a href="movies.html">movies</a>
      <a class="here" href="photos.html">photos</a>
    </nav>

    <h1>Photos</h1>
    <p class="lede">Click any photo to see it larger.</p>

    <div class="grid" id="grid"></div>
    <p class="empty" id="empty" hidden>No photos yet.</p>

    <footer>Everything here was shot by me.</footer>
  </div>

  <div id="lightbox"><img alt=""></div>

  <script>
    const grid = document.getElementById("grid");
    const box = document.getElementById("lightbox");
    const boxImg = box.querySelector("img");

    box.addEventListener("click", () => box.classList.remove("open"));
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") box.classList.remove("open");
    });

    fetch("photos.json")
      .then(r => r.json())
      .then(photos => {
        if (!photos.length) {
          document.getElementById("empty").hidden = false;
          return;
        }
        photos.forEach(p => {
          const fig = document.createElement("figure");
          const img = document.createElement("img");
          img.src = "photos/" + p.file;
          img.alt = p.caption || "";
          img.loading = "lazy";
          img.addEventListener("click", () => {
            boxImg.src = img.src;
            boxImg.alt = img.alt;
            box.classList.add("open");
          });
          fig.appendChild(img);
          if (p.caption) {
            const cap = document.createElement("figcaption");
            cap.textContent = p.caption;
            fig.appendChild(cap);
          }
          grid.appendChild(fig);
        });
      })
      .catch(() => {
        const e = document.getElementById("empty");
        e.textContent = "Couldn't load the photos.";
        e.hidden = false;
      });
  </script>
</body>
</html>
